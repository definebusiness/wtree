name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable Windows checkout line-ending conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Check formatting
        run: |
          set -o pipefail
          git ls-files -z -- '*.go' | ./scripts/ci-format.sh --stdin
      - name: Vet
        run: go vet ./...
      - name: Test
        if: runner.os != 'Windows'
        run: go test -timeout=30m ./...
      - name: Test Windows partitions
        if: runner.os == 'Windows'
        run: ./scripts/ci-test.sh normal
      - name: Race test
        if: runner.os != 'Windows'
        run: go test -race -timeout=45m ./...
      - name: Race test Windows partitions
        if: runner.os == 'Windows'
        run: ./scripts/ci-test.sh race
      - name: Build
        run: go build -o "$RUNNER_TEMP/wtree" ./cmd/wtree
      - name: Cross-platform release layout
        run: VERSION=0.0.0-ci DIST_DIR="$RUNNER_TEMP/dist" ./scripts/release-build.sh
      - name: Reuse release directory safely
        run: make release-test
      - name: Check release manifest
        run: |
          test -f "$RUNNER_TEMP/dist/SHA256SUMS"
          test -f "$RUNNER_TEMP/dist/wtree_0.0.0-ci_linux_amd64"
          test -f "$RUNNER_TEMP/dist/wtree_0.0.0-ci_darwin_amd64"
          test -f "$RUNNER_TEMP/dist/wtree_0.0.0-ci_windows_amd64.exe"
          test -f "$RUNNER_TEMP/dist/LICENSE"
          test -f "$RUNNER_TEMP/dist/NOTICE"
